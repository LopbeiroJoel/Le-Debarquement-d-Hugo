[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  implementation "com.badlogicgames.gdx-video:gdx-video:1.3.4"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


tasks.register('verifierCarte', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath + files(rootProject.file('assets'))
  mainClass = 'hugo.map.TestsMonde'
  maxHeapSize = '512m'
}
tasks.named('test') {
  dependsOn verifierCarte
  failOnNoDiscoveredTests = false
}
tasks.named('check') {
  dependsOn verifierCarte
}
