[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  implementation "com.badlogicgames.gdx-video:gdx-video:1.3.4"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


tasks.register('verifyWorld', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath + files(rootProject.file('assets'))
  mainClass = 'hugo.map.WorldTests'
  maxHeapSize = '512m'
}
tasks.named('test') {
  dependsOn verifyWorld
  dependsOn verifyWeapons
  dependsOn verifyUpgrades
  dependsOn verifyWaves
  failOnNoDiscoveredTests = false
}
tasks.named('check') {
  dependsOn verifyWorld
}

tasks.register('verifyWeapons', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'hugo.weapon.WeaponTests'
}

tasks.register('verifyUpgrades', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'hugo.upgrade.UpgradePoolTests'
}

tasks.register('verifyWaves', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'hugo.wave.WaveTests'
}
